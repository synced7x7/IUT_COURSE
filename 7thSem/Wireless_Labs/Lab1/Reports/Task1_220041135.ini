[General]
network = WiredAndWirelessHosts

#4
sim-time-limit = 500s


**.*Host*.numApps = 3

**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort= 1000

**.*Host*.app[1].typename = "UdpBasicApp"
**.*Host*.app[2].typename = "UdpBasicApp"

**.*Host*.app[1].destPort = 1000
**.*Host*.app[2].destPort = 1000

#1
**.*Host*.app[1].messageLength = 500B
**.*Host*.app[2].messageLength = 500B

#2
**.*Host*.app[1].sendInterval = 0.5s
**.*Host*.app[2].sendInterval = 0.5s

#3
**.*Host*.app[1].stopTime = 350s
**.*Host*.app[2].stopTime = 350s

**.wiredHost1.app[1].destAddresses = "wiredHost2"
**.wiredHost1.app[2].destAddresses = "wirelessHost1"
**.wiredHost2.app[1].destAddresses = "wiredHost1"
**.wiredHost2.app[2].destAddresses= "wirelessHost1"
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wirelessHost1.app[2].destAddresses = "wiredHost2"
