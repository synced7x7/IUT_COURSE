
[General]
network = WiredAndWirelessHosts3
sim-time-limit = 400s

**.vector-recording              = false
**.wiredHost1.*.vector-recording = true
**.router.*.vector-recording     = true

**.*Host*.numApps = 3

**.*Host*.app[0].typename  = "UdpEchoApp"
**.*Host*.app[0].localPort = 1000

**.*Host*.app[1].typename      = "UdpBasicApp"
**.*Host*.app[2].typename      = "UdpBasicApp"

**.*Host*.app[1].destPort      = 1000
**.*Host*.app[2].destPort      = 1000

**.*Host*.app[1].messageLength = 100B
**.*Host*.app[2].messageLength = 100B
**.*Host*.app[1].stopTime      = 300s
**.*Host*.app[2].stopTime      = 300s


**.*Host*.app[1..].sendInterval = exponential(1s)

**.wiredHost1.app[1].startTime   = 0s
**.wiredHost1.app[2].startTime   = 5s
**.wiredHost2.app[1].startTime   = 10s
**.wiredHost2.app[2].startTime   = 15s
**.wirelessHost1.app[1].startTime = 20s
**.wirelessHost1.app[2].startTime = 25s

**.wiredHost1.app[1].destAddresses    = "wiredHost2"
**.wiredHost1.app[2].destAddresses    = "wirelessHost1"
**.wiredHost2.app[1].destAddresses    = "wiredHost1"
**.wiredHost2.app[2].destAddresses    = "wirelessHost1"
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wirelessHost1.app[2].destAddresses = "wiredHost2"
