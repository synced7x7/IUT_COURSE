[Config WirelessMediumBaseline]
network = WirelessMediumStudy
sim-time-limit = 200s

**.addDefaultRoutes = false

# --- Application setup --------------------------------------
# All 4 hosts run 2 apps: one echo server, one UDP sender
**.*host*.numApps = 2

**.*host*.app[0].typename = "UdpEchoApp"
**.*host*.app[0].localPort = 5000

**.*host*.app[*].typename = "UdpBasicApp"

# Traffic pattern: each host sends to one other host via the AP
**.host1.app[1].destAddresses = "host3"
**.host2.app[1].destAddresses = "host4"
**.host3.app[1].destAddresses = "host1"
**.host4.app[1].destAddresses = "host2"

**.*host*.app[1].destPort = 5000
**.*host*.app[1].messageLength = 1000B
**.*host*.app[1].sendInterval = 0.1s    # high load: 10 pkt/s per host
**.*host*.app[1].startTime = 0s
**.*host*.app[1].stopTime = 180s

# --- 802.11 PHY parameters ----------------------------------
**.wlan[0].radio.transmitter.power = 20mW
**.wlan[0].radio.carrierFrequency = 2.4GHz
**.wlan[0].radio.transmitter.bitrate = 54Mbps
**.wlan[0].radio.receiver.sensitivity = -85dBm
**.wlan[0].radio.receiver.energyDetection = -85dBm

# --- CSMA/CA MAC parameters (802.11g defaults) ---------------
**.wlan[*].mac.dcf.channelAccess.retryLimit = 11
**.wlan[*].mac.dcf.channelAccess.cwMin = 15
**.wlan[*].mac.dcf.channelAccess.cwMax = 1023
# **.wlan[*].mac.dcf.channelAccess.cwMulticast = 15
# **.wlan[*].mac.dcf.channelAccess.sifsTime = 10us
# **.wlan[*].mac.dcf.channelAccess.slotTime = 20us
# **.wlan[*].mac.dcf.channelAccess.difsTime = 10us + 2 * 20us
# **.wlan[*].mac.dcf.channelAccess.ackTimeout = 10us + 2 * 20us

**.wlan[*].mac.rtsThresholdBytes = 3000B

# --- Result recording -----------------------------------------
**.vector-recording = true


#Task 4


[Config BEB_Aggressive]
network = WirelessMediumStudy
sim-time-limit = 200s
**.addDefaultRoutes = false

**.*host*.numApps = 2
**.*host*.app[0].typename = "UdpEchoApp"
**.*host*.app[0].localPort = 5000
**.*host*.app[*].typename = "UdpBasicApp"

# All 6 hosts send to each other (round-robin)
**.host1.app[1].destAddresses = "host4"
**.host2.app[1].destAddresses = "host5"
**.host3.app[1].destAddresses = "host6"
**.host4.app[1].destAddresses = "host1"
**.host5.app[1].destAddresses = "host2"
**.host6.app[1].destAddresses = "host3"

**.*host*.app[1].destPort = 5000
**.*host*.app[1].messageLength = 1000B
**.*host*.app[1].sendInterval = 0.02s
**.*host*.app[1].stopTime = 180s

**.wlan[0].radio.transmitter.power = 20mW
**.wlan[0].radio.transmitter.bitrate = 54Mbps
**.wlan[0].mac.dcf.channelAccess.cwMin = 15
**.wlan[0].mac.dcf.channelAccess.cwMax = 63
**.wlan[0].mac.dcf.channelAccess.retryLimit = 3


[Config BEB_Patient]
extends = BEB_Aggressive
**.wlan[0].mac.dcf.channelAccess.cwMax = 1023
**.wlan[0].mac.dcf.channelAccess.retryLimit = 7




