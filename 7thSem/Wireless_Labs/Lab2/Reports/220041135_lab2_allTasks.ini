[General]
network = WiredAndWirelessHosts

#4
sim-time-limit = 300s


**.*Host*.numApps = 3

**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort= 1000

**.*Host*.app[1].typename = "UdpBasicApp"
**.*Host*.app[2].typename = "UdpBasicApp"

**.*Host*.app[1].destPort = 1000
**.*Host*.app[2].destPort = 1000

#1
**.*Host*.app[1].messageLength = 500B
**.*Host*.app[2].messageLength = 500B

#2
**.*Host*.app[1].sendInterval = 0.5s
**.*Host*.app[2].sendInterval = 0.5s

#3
**.*Host*.app[1].stopTime = 350s
**.*Host*.app[2].stopTime = 350s

**.wiredHost1.app[1].destAddresses = "wiredHost2"
**.wiredHost1.app[2].destAddresses = "wirelessHost1"
**.wiredHost2.app[1].destAddresses = "wiredHost1"
**.wiredHost2.app[2].destAddresses= "wirelessHost1"
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wirelessHost1.app[2].destAddresses = "wiredHost2"

[Config ChannelBaseline]
extends = General

# Disable automatic routing
**.addDefaultRoutes = false

# ---------------- Wireless PHY Configuration ----------------
**.wlan[0].radio.transmitter.power = 20mW        # ≈ 13 dBm
**.wlan[0].radio.transmitter.bitrate = 54Mbps   # 802.11g max
**.wlan[0].radio.receiver.sensitivity = -85dBm  # minimum detectable power
**.wlan[0].radio.receiver.energyDetection = -85dBm  # channel busy threshold
**.wlan[0].radio.carrierFrequency = 2.4GHz

# ---------------- Path Loss Model ----------------
**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"

# ---------------- Background Noise ----------------
**.radioMedium.backgroundNoise.power = -110dBm   # low noise baseline

# ---------------- Visual Positioning ----------------
**.initialZ = 0m

[Config Attenuation_Study]
extends = ChannelBaseline

# Reduce transmit power: the wireless link becomes marginal
# At 1mW (~0 dBm), max path loss = 0 - (-85) = 85 dB
# which corresponds to ~28m in free space
**.wlan[0].radio.transmitter.power = 1mW

# Also try: 0.1mW = -10 dBm -> max path loss = 75 dB -> ~9m range


# **.wlan[0].radio.transmitter.power = 0.1mW

[Config Attenuation_Study_minimal]
extends = ChannelBaseline
**.wlan[0].radio.transmitter.power = 0.1mW

[Config Noise_Study]
extends = ChannelBaseline

# Raise the noise floor progressively:
# Low noise (baseline): -110 dBm -> high SNR, low BER
# Medium noise: -95 dBm -> SNR reduced by 15 dB
# High noise: -85 dBm -> SNR ~= 0 dB at sensitivity -> most packets fail
**.radioMedium.backgroundNoise.power = -95dBm

# With transmitter.power = 20mW = 13 dBm, received power at short
# range (e.g., 5m) via free space ~= 13 - 60 = -47 dBm
# SNR = -47 - (-95) = 48 dB -> still good
# SNR = -47 - (-85) = 38 dB -> marginal for 54 Mbps

[Config Noise_Study_Max]
extends = ChannelBaseline

**.radioMedium.backgroundNoise.power = -85dBm

[Config Interference_Study]
network = WiredAndWirelessHostsExtra
sim-time-limit = 200s
**.addDefaultRoutes = false

# --- Original hosts: same as baseline ---------------------------
**.*Host*.numApps = 2

**.*Host*.app[0].typename = "UdpEchoApp"
**.*Host*.app[0].localPort = 1000

**.*Host*.app[*].typename = "UdpBasicApp"

**.wiredHost1.app[1].destAddresses = "wirelessHost1"
**.wirelessHost1.app[1].destAddresses = "wiredHost1"
**.wiredHost2.app[1].destAddresses = "wiredHost1"

**.*Host*.app[1].destPort = 1000
**.*Host*.app[1].messageLength = 512B
**.*Host*.app[1].sendInterval = 0.5s
**.*Host*.app[1].stopTime = 180s

# --- Interferer: sends high-rate traffic on same channel --------
**.interferer.numApps = 1
**.interferer.app[0].typename = "UdpBasicApp"
**.interferer.app[0].destAddresses = "wiredHost2"
**.interferer.app[0].destPort = 1000
**.interferer.app[0].messageLength = 1400B   # large frames = more air time
**.interferer.app[0].sendInterval = 0.05s    # very high rate = heavy interference
**.interferer.app[0].startTime = 10s         # starts after main traffic established
**.interferer.app[0].stopTime = 150s         # stops before end to show recovery

# --- Wireless channel (same for all devices) --------------------
**.wlan[0].radio.transmitter.power = 20mW
**.wlan[0].radio.transmitter.bitrate = 54Mbps
**.wlan[0].radio.receiver.sensitivity = -85dBm
**.wlan[0].radio.receiver.energyDetection = -85dBm
**.wlan[0].radio.carrierFrequency = 2.4GHz

**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
**.radioMedium.backgroundNoise.power = -110dBm

# --- Visual positioning -----------------------------------------
**.initialZ = 0m


